<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Hitster</title>
  <style>
    body { background: #121212; color: #ffffff; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    button { background: #1DB954; color: white; border: none; padding: 25px 50px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4); margin-top: 30px; }
    button:active { transform: scale(0.95); }
    h1 { font-size: 5rem; margin: 0; color: #1DB954; }
    h2 { font-size: 3rem; margin: 10px 0; color: #ffffff; }
    h3 { font-size: 2rem; margin: 10px 0; color: #b3b3b3; }
    .year { font-size: 4rem; color: #1DB954; font-weight: bold; margin-top: 20px; }
    p { font-size: 1.5rem; color: #b3b3b3; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Song-Info-Bildschirm (Startbildschirm) -->
  <div id="song-screen" class="screen">
    <h3 id="artist-display">Interpret</h3>
    <h2 id="title-display">Titel</h2>
    <div class="year" id="year-display">1900</div>
    <button id="next-btn">Nächster Song</button>
  </div>

  <!-- Countdown-Bildschirm -->
  <div id="countdown-screen" class="screen hidden">
    <h1 id="timer">3</h1>
    <p>Jetzt umdrehen!</p>
  </div>

  <script>
    // Deine lokale Song-Datenbank
    const songDB = [
      { uri: "spotify:track:3z8h0TU7ReDPLIbEnYhWZb", artist: "Queen", title: "Bohemian Rhapsody", year: "1975" },
      { uri: "spotify:track:6rqhFgbbKwnb9MLmUQDhG6", artist: "Michael Jackson", title: "Billie Jean", year: "1982" },
      { uri: "spotify:track:4cOdK2wGLETKBW3PvgPWqT", artist: "Rick Astley", title: "Never Gonna Give You Up", year: "1987" }
    ];

    const songScreen = document.getElementById('song-screen');
    const countdownScreen = document.getElementById('countdown-screen');
    const timerElement = document.getElementById('timer');
    const nextBtn = document.getElementById('next-btn');
    
    const artistDisplay = document.getElementById('artist-display');
    const titleDisplay = document.getElementById('title-display');
    const yearDisplay = document.getElementById('year-display');

    let currentSong = null;

    // Wählt einen zufälligen Song aus und zeigt ihn an
    function pickNewSong() {
      currentSong = songDB[Math.floor(Math.random() * songDB.length)];
      artistDisplay.innerText = currentSong.artist;
      titleDisplay.innerText = currentSong.title;
      yearDisplay.innerText = currentSong.year;
    }

    // Beim Laden der App direkt den ersten Song anzeigen
    pickNewSong();

    nextBtn.addEventListener('click', () => {
      // 1. Ansicht auf Countdown wechseln
      songScreen.classList.add('hidden');
      countdownScreen.classList.remove('hidden');
      
      let timeLeft = 3;
      timerElement.innerText = timeLeft;

      // 2. Countdown herunterzählen
      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerElement.innerText = timeLeft;
        } else {
          clearInterval(countdown);
          
          // 3. Deep-Link feuert, Spotify öffnet sich
          window.location.href = currentSong.uri;
          
          // 4. Nach einer Sekunde zurückwechseln und direkt den NÄCHSTEN Song vorbereiten
          setTimeout(() => {
            countdownScreen.classList.add('hidden');
            songScreen.classList.remove('hidden');
            pickNewSong(); // Neuen Song für die nächste Runde laden
          }, 1000);
        }
      }, 1000);
    });
  </script>
</body>
</html>
