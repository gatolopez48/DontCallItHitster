<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Hitster</title>
  <style>
    body { background: #121212; color: #ffffff; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    button { background: #1DB954; color: white; border: none; padding: 25px 50px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4); margin-top: 30px; transition: 0.3s; }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled { background: #555; box-shadow: none; cursor: not-allowed; color: #aaa; }
    h1 { font-size: 5rem; margin: 0; color: #1DB954; }
    h2 { font-size: 3rem; margin: 10px 0; color: #ffffff; }
    h3 { font-size: 2rem; margin: 10px 0; color: #b3b3b3; }
    .year { font-size: 4rem; color: #1DB954; font-weight: bold; margin-top: 20px; }
    p { font-size: 1.5rem; color: #b3b3b3; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- 1. Startbildschirm -->
  <div id="start-screen" class="screen">
    <button id="start-btn" disabled>Lade Songs...</button>
    <p>Handy nach Klick sofort umdrehen!</p>
  </div>

  <!-- 2. Countdown-Bildschirm -->
  <div id="countdown-screen" class="screen hidden">
    <h1 id="timer">3</h1>
    <p>Jetzt umdrehen!</p>
  </div>

  <!-- 3. Auflösung / Song-Info-Bildschirm -->
  <div id="song-screen" class="screen hidden">
    <h3 id="artist-display">Interpret</h3>
    <h2 id="title-display">Titel</h2>
    <div class="year" id="year-display">1900</div>
    <button id="next-btn">Nächste Karte ziehen</button>
    <p>Handy nach Klick sofort umdrehen!</p>
  </div>

  <script>
    let songDB = [];

    const startScreen = document.getElementById('start-screen');
    const countdownScreen = document.getElementById('countdown-screen');
    const songScreen = document.getElementById('song-screen');
    
    const timerElement = document.getElementById('timer');
    const startBtn = document.getElementById('start-btn');
    const nextBtn = document.getElementById('next-btn');
    
    const artistDisplay = document.getElementById('artist-display');
    const titleDisplay = document.getElementById('title-display');
    const yearDisplay = document.getElementById('year-display');

    // JSON-Datei laden
    fetch('songs.json')
      .then(response => {
        if (!response.ok) throw new Error("Netzwerkfehler");
        return response.json();
      })
      .then(data => {
        songDB = data;
        // Button aktivieren, sobald die Daten da sind
        startBtn.disabled = false;
        startBtn.innerText = "Spiel starten";
      })
      .catch(error => {
        console.error("Fehler beim Laden der songs.json:", error);
        startBtn.innerText = "Fehler beim Laden";
      });

    function startRound() {
      if (songDB.length === 0) return; // Sicherheitshalber abbrechen, falls leer

      // 1. Zufälligen neuen Song auswählen
      const currentSong = songDB[Math.floor(Math.random() * songDB.length)];
      
      // 2. Ansicht auf Countdown wechseln
      startScreen.classList.add('hidden');
      songScreen.classList.add('hidden');
      countdownScreen.classList.remove('hidden');
      
      let timeLeft = 3;
      timerElement.innerText = timeLeft;

      // 3. Countdown herunterzählen
      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerElement.innerText = timeLeft;
        } else {
          clearInterval(countdown);
          
          // 4. Deep-Link feuert, Spotify öffnet sich
          window.location.href = currentSong.uri;
          
          // 5. Während Spotify im Vordergrund ist, baut sich im Hintergrund die Auflösung auf
          setTimeout(() => {
            countdownScreen.classList.add('hidden');
            songScreen.classList.remove('hidden');
            
            // Song-Daten ins HTML eintragen
            artistDisplay.innerText = currentSong.artist;
            titleDisplay.innerText = currentSong.title;
            yearDisplay.innerText = currentSong.year;
          }, 1000);
        }
      }, 1000);
    }

    startBtn.addEventListener('click', startRound);
    nextBtn.addEventListener('click', startRound);
  </script>
</body>
</html>
