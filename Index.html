<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Hitster</title>
  <style>
    /* Grundlegendes Styling für eine App-ähnliche, dunkle Oberfläche */
    body { background: #121212; color: #ffffff; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    /* Screen-Klasse zentriert den Inhalt des jeweiligen Bildschirms */
    .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
    /* Hilfsklasse zum Ausblenden inaktiver Bildschirme */
    .hidden { display: none !important; }
    
    /* Button-Design (ähnlich wie Spotify/Hitster) */
    button { background: #1DB954; color: white; border: none; padding: 25px 50px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4); margin-top: 30px; transition: 0.3s; }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled { background: #555; box-shadow: none; cursor: not-allowed; color: #aaa; }
    
    /* Typografie */
    h1 { font-size: 5rem; margin: 0; color: #1DB954; }
    h2 { font-size: 3rem; margin: 10px 0; color: #ffffff; }
    h3 { font-size: 2rem; margin: 10px 0; color: #b3b3b3; }
    .year { font-size: 4rem; color: #1DB954; font-weight: bold; margin-top: 20px; }
    p { font-size: 1.5rem; color: #b3b3b3; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- 1. Startbildschirm: Wird beim ersten Laden der Seite angezeigt -->
  <div id="start-screen" class="screen">
    <button id="start-btn">Spiel starten</button>
    <p>Handy nach Klick sofort umdrehen!</p>
  </div>

  <!-- 2. Countdown-Bildschirm: Gibt den Spielern Zeit, das Handy umzudrehen -->
  <div id="countdown-screen" class="screen hidden">
    <h1 id="timer">3</h1>
    <p>Jetzt umdrehen!</p>
  </div>

  <!-- 3. Auflösung / Song-Info-Bildschirm: Zeigt das Jahr und den Song an -->
  <div id="song-screen" class="screen hidden">
    <h3 id="artist-display">Interpret</h3>
    <h2 id="title-display">Titel</h2>
    <div class="year" id="year-display">1900</div>
    <button id="next-btn">Nächste Karte ziehen</button>
    <p>Handy nach Klick sofort umdrehen!</p>
  </div>
