<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Hitster</title>
  <style>
    body { background: #121212; color: #ffffff; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #start-screen, #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    button { background: #1DB954; color: white; border: none; padding: 25px 50px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4); }
    button:active { transform: scale(0.95); }
    h1 { font-size: 5rem; margin: 0; color: #1DB954; }
    p { font-size: 1.5rem; color: #b3b3b3; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Startbildschirm -->
  <div id="start-screen">
    <button id="draw-btn">Neue Karte ziehen</button>
    <p>Handy danach sofort umdrehen!</p>
  </div>

  <!-- Countdown-Bildschirm -->
  <div id="countdown-screen" class="hidden">
    <h1 id="timer">3</h1>
    <p>Jetzt umdrehen!</p>
  </div>

  <script>
    // Deine lokale Song-Datenbank
    const songDB = [
      { uri: "spotify:track:3z8h0TU7ReDPLIbEnYhWZb", artist: "Queen", title: "Bohemian Rhapsody", year: "1975" },
      { uri: "spotify:track:6rqhFgbbKwnb9MLmUQDhG6", artist: "Michael Jackson", title: "Billie Jean", year: "1982" },
      { uri: "spotify:track:4cOdK2wGLETKBW3PvgPWqT", artist: "Rick Astley", title: "Never Gonna Give You Up", year: "1987" }
    ];

    const startScreen = document.getElementById('start-screen');
    const countdownScreen = document.getElementById('countdown-screen');
    const timerElement = document.getElementById('timer');
    const drawBtn = document.getElementById('draw-btn');

    drawBtn.addEventListener('click', () => {
      // 1. Zufälligen Song auswählen
      const song = songDB[Math.floor(Math.random() * songDB.length)];
      
      // 2. Ansicht auf schwarzen Countdown wechseln
      startScreen.classList.add('hidden');
      countdownScreen.classList.remove('hidden');
      
      let timeLeft = 3;
      timerElement.innerText = timeLeft;

      // 3. Countdown herunterzählen
      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerElement.innerText = timeLeft;
        } else {
          clearInterval(countdown);
          
          // 4. Deep-Link feuert, Betriebssystem öffnet native Spotify App
          window.location.href = song.uri;
          
          // 5. Nach einer Sekunde (während Spotify im Vordergrund ist) 
          // baut die Web-App im Hintergrund wieder den Startbildschirm auf
          setTimeout(() => {
            countdownScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
          }, 1000);
        }
      }, 1000);
    });
  </script>
</body>
</html>
